[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-agent"
version = "0.1.0"
description = "Experimental, simulation-only trading-agent framework"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ibkr-agent = "ibkr_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
